<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মাইনক্রাফ্ট রান</title>
<style>
:root{--bg:#1d1d1d;--fg:#fff;--btn:#6b6b6b;--btn2:#4caf2f;--edge:#2a2a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--fg:#fff}}
:root[data-theme="dark"]{--bg:#121212;--fg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;overscroll-behavior:none}
body{color:#fff}
#stage{position:fixed;left:0;top:0;background:#000;display:flex;align-items:center;justify-content:center;transform-origin:0 0}
canvas{image-rendering:pixelated;display:block}
.mc{display:none!important;position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));min-width:150px;height:76px;padding:0 18px;display:flex;align-items:center;justify-content:center;gap:12px;font:700 24px/1 "Courier New",monospace;color:#fff;text-shadow:3px 3px 0 #3b3b3b;background:#7d7d7d;border:4px solid #000;border-radius:0;box-shadow:inset 4px 4px 0 #bdbdbd,inset -4px -4px 0 #4a4a4a;touch-action:none;opacity:.93;cursor:pointer}
.mc.on{background:#5f6f9a;box-shadow:inset 4px 4px 0 #4a4a4a,inset -4px -4px 0 #9fb0e0;transform:translateY(3px)}
.mc svg{width:30px;height:30px;shape-rendering:crispEdges;filter:drop-shadow(3px 3px 0 #3b3b3b)}
#run{left:max(18px,env(safe-area-inset-left,0px))}
#jump{right:max(18px,env(safe-area-inset-right,0px))}
#fs{top:10px;right:10px;bottom:auto;min-width:0;width:52px;height:52px;padding:0;font-size:22px}
</style>
</head>
<body>
<div id="stage">
<canvas id="c" width="960" height="540"></canvas>
<button class="mc" id="run"><svg viewBox="0 0 8 8" fill="#fff"><rect x="0" y="3" width="5" height="2"/><rect x="4" y="1" width="1" height="6"/><rect x="5" y="2" width="1" height="4"/><rect x="6" y="3" width="1" height="2"/></svg>দৌড়</button>
<button class="mc" id="jump"><svg viewBox="0 0 8 8" fill="#fff"><rect x="3" y="0" width="2" height="1"/><rect x="2" y="1" width="4" height="1"/><rect x="1" y="2" width="6" height="1"/><rect x="3" y="3" width="2" height="5"/></svg>লাফ</button>
<button class="mc" id="fs">⛶</button>
</div>
